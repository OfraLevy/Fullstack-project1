    <title>נגר תבלינים</title>
  </head>

  <body>
    <header class="main-header">
      <div class="header-left">
        <a href="index.html"><img src="../media/nagarlogo.png" alt="לוגו נגר תבלינים" class="logo"/></a>
      </div>
      <div class="header-right">
        <img src="../media/user.png" alt="User Icon" class="header-icon"/>
        <img src="../media/shopping-bag.png" alt="Shopping Bag Icon" class="header-icon"/>
        <img src="../media/favourite.png" alt="Favorites Icon" class="header-icon"/>
      </div>

    </header>

    <nav class="main-nav">
      <ul class="nav-list">
        <li class="nav-item"><a href="catalog.html">המוצרים שלנו</a></li>

      </ul>
    </nav>

    <section class="contact-page">
        <!-- Contact Form -->
        <div class="contact-section">
            <h1>צור קשר</h1>
            <form action="#" method="post">

            <!-- First name -->
            <label for="first-name">שם פרטי</label>
            <input type="text" id="first-name" name="first-name" placeholder="הכנס את שמך הפרטי" required>

            <!-- Last name -->
            <label for="last-name">שם משפחה</label>
            <input type="text" id="last-name" name="last-name" placeholder="הכנס את שם המשפחה" required>



            <label for="email">אימייל</label>
            <input type="email" id="email" name="email" placeholder="הכנס את האימייל שלך" required>

            <label for="phone">טלפון נייד</label>
            <input type="tel" id="phone" name="phone" placeholder="הכנס את מספר הנייד שלך" required>

            <label for="message">הודעה</label>
            <textarea id="message" name="message" placeholder="כתוב כאן את ההודעה שלך" required></textarea>

            <button type="submit">שלח</button>
            </form>
        </div>

        <!-- Image -->
        <img class="contact-image" src="../media/contantpage.png" alt="תבלינים">
    </section>


    <footer class="main-footer">
      <div class="footer-links">
        <a href="about_us.html">אודות</a> | 
        <a href="contact.html">צור קשר</a>
      </div>
      <div class="footer-contact">
        טלפון: 03-5554433 | אימייל: NagerTav@gmail.com
      </div>
      <div class="footer-copy">
        © 2025 כל הזכויות שמורות
      </div>
    </footer>


    
  </body>
</html>
