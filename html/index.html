<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />

  <body>

      <div class="header-right">

    <nav class="main-nav">
      <ul class="nav-list">

        <li class="nav-item"><a href="gift_boxes.html">מארזים ומתנות</a></li>
